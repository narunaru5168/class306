<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔢 數學練習遊戲｜三年六班</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#3B82F6;--blue-d:#1D4ED8;--orange:#F97316;--green:#22C55E;
  --yellow:#FCD34D;--red:#EF4444;--purple:#8B5CF6;
  --bg:#EFF6FF;--card:#FFFEF7;--dark:#1E3A5F;--mid:#64748B;
  --shadow:0 8px 32px rgba(29,78,216,.12);--radius:20px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Nunito',sans-serif;
  background:linear-gradient(160deg,#dbeafe 0%,#fef9c3 50%,#dcfce7 100%);
  min-height:100vh;color:var(--dark);
}
h1,h2,.baloo{font-family:'Baloo 2',cursive;}
.topbar{
  background:linear-gradient(90deg,#1D4ED8,#3B82F6,#8B5CF6);
  padding:10px 28px;min-height:64px;display:flex;align-items:center;
  justify-content:space-between;gap:16px;flex-wrap:wrap;
  box-shadow:0 4px 20px rgba(29,78,216,.35);position:sticky;top:0;z-index:100;
}
.topbar .logo{font-family:'Baloo 2',cursive;font-size:1.4rem;font-weight:800;color:#fff;display:flex;align-items:center;gap:8px;}
.topbar a{background:rgba(255,255,255,.22);border-radius:50px;color:#fff;font-weight:700;font-size:.88rem;padding:8px 18px;text-decoration:none;transition:.2s;}
.topbar a:hover{background:rgba(255,255,255,.35);}
.wrap{max-width:960px;margin:0 auto;padding:20px 14px 60px;}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:16px;}
.section-title{font-family:'Baloo 2',cursive;font-size:1.25rem;font-weight:800;color:var(--dark);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.lead{color:#5a6680;font-size:.88rem;margin-bottom:10px;line-height:1.6;}
.btn{border:none;border-radius:50px;font-family:'Nunito',sans-serif;font-weight:800;cursor:pointer;transition:transform .15s,box-shadow .15s;display:inline-flex;align-items:center;gap:6px;font-size:.92rem;padding:10px 22px;}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.15);}
.btn:active{transform:scale(.96);}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;}
.btn-success{background:linear-gradient(135deg,var(--green),#16a34a);color:#fff;}
.btn-flat{background:#eef2f7;color:var(--dark);}
.mode-tab{background:#eef2f7;color:var(--dark);}
.mode-tab.active{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;}
select{font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:700;color:var(--dark);border:2px solid #e2e8f0;border-radius:12px;padding:10px 14px;background:#fff;outline:none;}
.controls-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;}
.stat-pill{background:#eef2f7;border-radius:999px;padding:6px 16px;font-weight:800;font-size:.9rem;display:flex;align-items:center;gap:6px;}
.hidden{display:none!important;}
.mode-panel.hidden{display:none!important;}

/* Question banner */
.question-banner{
  background:linear-gradient(135deg,#1D4ED8,#3B82F6);
  color:#fff;border-radius:16px;padding:20px 24px;
  font-family:'Baloo 2',cursive;font-size:1.5rem;font-weight:800;
  text-align:center;min-height:76px;display:flex;align-items:center;
  justify-content:center;margin-bottom:14px;line-height:1.5;
}
/* Timer bar */
.timer-bar-wrap{background:#e2e8f0;border-radius:999px;height:10px;margin-bottom:14px;overflow:hidden;}
.timer-bar{height:100%;background:linear-gradient(90deg,var(--green),var(--yellow),var(--orange),var(--red));border-radius:999px;transition:width .1s linear;}

/* Quiz grid */
.quiz-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.quiz-opt{
  background:linear-gradient(135deg,#f8faff,#e8f0fe);
  border:3px solid #bfdbfe;border-radius:16px;
  padding:20px 14px;font-family:'Baloo 2',cursive;
  font-size:1.2rem;font-weight:800;text-align:center;
  cursor:pointer;transition:all .15s;color:var(--dark);
  min-height:80px;display:flex;align-items:center;justify-content:center;
  line-height:1.3;
}
.quiz-opt:hover:not(.disabled){transform:scale(1.03);border-color:var(--blue);}
.quiz-opt.correct{background:linear-gradient(135deg,#dcfce7,#bbf7d0)!important;border-color:var(--green)!important;color:#15803d!important;}
.quiz-opt.wrong{background:linear-gradient(135deg,#fee2e2,#fecaca)!important;border-color:var(--red)!important;color:#b91c1c!important;}
.quiz-opt.disabled{pointer-events:none;opacity:.85;}

/* Sprint timer mode specific */
.sprint-info{text-align:center;padding:8px;color:var(--mid);font-size:.85rem;margin-bottom:8px;}
.combo-flash{
  font-family:'Baloo 2',cursive;font-size:1.8rem;font-weight:900;
  text-align:center;color:var(--orange);animation:popIn .4s ease;
}
@keyframes popIn{from{transform:scale(.5);opacity:0;}to{transform:scale(1);opacity:1;}}

/* Memory grid */
.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:4px;}
.mem-card{
  aspect-ratio:7/5;cursor:pointer;position:relative;border-radius:14px;
  transform-style:preserve-3d;transition:transform .35s;
}
.mem-card:hover .front{box-shadow:0 0 0 3px var(--blue);}
.mem-card.flipped{transform:rotateY(180deg);}
.mem-card.matched{transform:rotateY(180deg);}
.mem-card .front,.mem-card .back{
  position:absolute;inset:0;border-radius:14px;
  backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  font-family:'Baloo 2',cursive;font-weight:800;padding:6px;text-align:center;
}
.mem-card .front{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-size:2rem;}
.mem-card .back{background:#fff;border:3px solid #bfdbfe;color:var(--dark);font-size:.9rem;transform:rotateY(180deg);}
.mem-card.matched .back{background:linear-gradient(135deg,#dcfce7,#bbf7d0);border-color:var(--green);color:#15803d;}

/* Win banner */
.win-banner{
  background:linear-gradient(135deg,#FCD34D,#F97316);
  color:#fff;border-radius:16px;padding:16px 24px;
  font-family:'Baloo 2',cursive;font-size:1.3rem;font-weight:800;
  text-align:center;margin-top:14px;
}

@media(max-width:600px){
  .quiz-grid{grid-template-columns:1fr;}
  .quiz-opt{font-size:1rem;min-height:62px;}
  .question-banner{font-size:1.15rem;}
  .memory-grid{grid-template-columns:repeat(3,1fr);}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">🔢 數學練習・三年六班</div>
  <a href="index.html">← 回主頁</a>
</header>

<div class="wrap">

  <!-- 單元選擇 -->
  <div class="card">
    <div class="section-title">📚 選擇單元</div>
    <div class="controls-row">
      <select id="unitSel" onchange="onUnitChange()">
        <option value="u1">第一單元・10000以內的數</option>
        <option value="u2">第二單元・四位數的加減</option>
        <option value="u3">第三單元・毫米</option>
        <option value="u4">第四單元・乘法</option>
        <option value="u5">第五單元・角</option>
        <option value="u6">第六單元・面積</option>
        <option value="u7">第七單元・除法</option>
        <option value="u8">第八單元・公升和毫升</option>
        <option value="u9">第九單元・分數</option>
      </select>
      <span id="unitBadge" class="stat-pill" style="background:#dbeafe;"></span>
    </div>
  </div>

  <!-- 模式選擇 -->
  <div class="card">
    <div class="section-title">🎮 選擇遊戲模式</div>
    <div class="controls-row">
      <button class="btn mode-tab active" data-mode="quiz" onclick="switchMode('quiz')">🎯 選擇搶答</button>
      <button class="btn mode-tab" data-mode="sprint" onclick="switchMode('sprint')">⚡ 計時衝刺</button>
      <button class="btn mode-tab" data-mode="memory" onclick="switchMode('memory')">🃏 配對翻牌</button>
    </div>
  </div>

  <!-- ══ 選擇搶答 ══ -->
  <div class="card mode-panel" id="modeQuiz">
    <div class="lead">看題目選出正確答案，答對越多連續題分數越高！適合電子白板讓學生上台點選。</div>
    <div class="controls-row" style="margin-bottom:14px">
      <button class="btn btn-primary" onclick="startQuiz()">▶️ 開始搶答</button>
      <button class="btn btn-flat" onclick="resetQuiz()">🔄 重置</button>
      <span class="stat-pill">⭐ <span id="qzScore">0</span></span>
      <span class="stat-pill">🔥 連續 <span id="qzCombo">0</span></span>
      <span class="stat-pill">🏆 最高 <span id="qzBest">0</span></span>
    </div>
    <div class="question-banner" id="qzBanner">選好單元後按「開始搶答」🎯</div>
    <div class="quiz-grid" id="qzGrid"></div>
    <div id="qzComboFlash" style="min-height:50px;margin-top:8px;"></div>
  </div>

  <!-- ══ 計時衝刺 ══ -->
  <div class="card mode-panel hidden" id="modeSprint">
    <div class="lead">每題限時 5 秒！在時間倒數到 0 前點出正確答案。越快作答分數越高，要搶先！</div>
    <div class="controls-row" style="margin-bottom:14px">
      <button class="btn btn-primary" onclick="startSprint()">▶️ 開始衝刺</button>
      <button class="btn btn-flat" onclick="resetSprint()">🔄 重置</button>
      <span class="stat-pill">⭐ <span id="spScore">0</span></span>
      <span class="stat-pill">🔥 連續 <span id="spCombo">0</span></span>
      <span class="stat-pill">🏆 最高 <span id="spBest">0</span></span>
    </div>
    <div class="question-banner" id="spBanner">選好單元後按「開始衝刺」⚡</div>
    <div class="timer-bar-wrap" id="spTimerWrap" style="display:none">
      <div class="timer-bar" id="spTimerBar" style="width:100%"></div>
    </div>
    <div class="sprint-info" id="spTimerText"></div>
    <div class="quiz-grid" id="spGrid"></div>
    <div id="spComboFlash" style="min-height:50px;margin-top:8px;"></div>
  </div>

  <!-- ══ 配對翻牌 ══ -->
  <div class="card mode-panel hidden" id="modeMemory">
    <div class="lead">翻開卡片，把算式和答案配對！翻的次數越少越厲害。</div>
    <div class="controls-row" style="margin-bottom:14px">
      <label style="display:flex;align-items:center;gap:8px;font-weight:800;font-size:.9rem;">
        🧩 組數
        <select id="memPairs">
          <option value="4">4 組（快速）</option>
          <option value="6" selected>6 組</option>
          <option value="8">8 組（挑戰）</option>
        </select>
      </label>
      <button class="btn btn-primary" onclick="startMemory()">▶️ 開始翻牌</button>
      <span class="stat-pill">👆 翻了 <span id="memTries">0</span> 次</span>
      <span class="stat-pill">✅ 配到 <span id="memMatched">0</span> 組</span>
      <span class="stat-pill">🏆 最少 <span id="memBest">—</span></span>
    </div>
    <div class="memory-grid" id="memGrid"></div>
    <div id="memWin"></div>
  </div>

</div><!-- /wrap -->

// ═══════════════════════════════════════════════════════
// 工具
// ═══════════════════════════════════════════════════════
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k));}catch{return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

// ═══════════════════════════════════════════════════════
// 全域狀態
// ═══════════════════════════════════════════════════════
let CU='u1'; // current unit
let currentMode='quiz';

// Quiz
let qzQs=[],qzIdx=0,qzScore=0,qzCombo=0,qzBest=0,qzRunning=false;

// Sprint
let spQs=[],spIdx=0,spScore=0,spCombo=0,spBest=0,spRunning=false;
let spInterval=null,spStartTime=0,spTime=5000; // 5 seconds

// Memory
let memCards=[],memFlipped=[],memMatchCount=0,memTryCount=0,memCanFlip=true;

// ═══════════════════════════════════════════════════════
// UI
// ═══════════════════════════════════════════════════════
function onUnitChange(){
  CU=document.getElementById('unitSel').value;
  document.getElementById('unitBadge').textContent='📝 '+MATH_UNITS[CU].qs.length+' 題・🃏 '+MATH_UNITS[CU].pairs.length+' 配對組';
  resetAll();
}
function switchMode(mode){
  currentMode=mode;
  document.querySelectorAll('.mode-tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  document.getElementById('modeQuiz').classList.toggle('hidden',mode!=='quiz');
  document.getElementById('modeSprint').classList.toggle('hidden',mode!=='sprint');
  document.getElementById('modeMemory').classList.toggle('hidden',mode!=='memory');
  resetAll();
}
function resetAll(){resetQuiz();resetSprint();}

// ═══════════════════════════════════════════════════════
// 🎯 選擇搶答
// ═══════════════════════════════════════════════════════
function startQuiz(){
  qzQs=shuffle(MATH_UNITS[CU].qs);
  qzIdx=0;qzScore=0;qzCombo=0;
  qzBest=lsGet('mq_best_'+CU)||0;
  document.getElementById('qzBest').textContent=qzBest;
  document.getElementById('qzScore').textContent=0;
  document.getElementById('qzCombo').textContent=0;
  qzRunning=true;
  showQzQ();
}
function resetQuiz(){
  qzRunning=false;
  document.getElementById('qzBanner').textContent='選好單元後按「開始搶答」🎯';
  document.getElementById('qzGrid').innerHTML='';
  document.getElementById('qzComboFlash').innerHTML='';
}
function showQzQ(){
  if(!qzRunning)return;
  if(qzIdx>=qzQs.length){qzQs=shuffle(MATH_UNITS[CU].qs);qzIdx=0;}
  const q=qzQs[qzIdx];
  document.getElementById('qzBanner').textContent=q.q;
  renderOpts('qzGrid',shuffle(q.opts),q.a,answerQuiz);
}
function renderOpts(gridId,opts,correct,cb){
  const grid=document.getElementById(gridId);
  grid.innerHTML='';
  opts.forEach(o=>{
    const btn=document.createElement('button');
    btn.className='quiz-opt';
    btn.textContent=o;
    btn.addEventListener('click',()=>cb(btn,o,correct,opts));
    grid.appendChild(btn);
  });
}
function answerQuiz(btn,chosen,correct){
  if(!qzRunning)return;
  const ok=chosen===correct;
  if(ok){
    qzCombo++;
    qzScore+=10+Math.min(qzCombo-1,5)*5;
    btn.classList.add('correct');
    if(qzCombo>=3) showComboFlash('qzComboFlash','🔥 '+qzCombo+' 連！+'+Math.min(qzCombo-1,5)*5);
  }else{
    qzCombo=0;
    btn.classList.add('wrong');
    document.querySelectorAll('#qzGrid .quiz-opt').forEach(b=>{
      if(b.textContent===correct)b.classList.add('correct');
    });
  }
  document.querySelectorAll('#qzGrid .quiz-opt').forEach(b=>b.classList.add('disabled'));
  document.getElementById('qzScore').textContent=qzScore;
  document.getElementById('qzCombo').textContent=qzCombo;
  if(qzScore>qzBest){qzBest=qzScore;lsSet('mq_best_'+CU,qzBest);document.getElementById('qzBest').textContent=qzBest;}
  qzIdx++;
  setTimeout(showQzQ,ok?850:1600);
}

// ═══════════════════════════════════════════════════════
// ⚡ 計時衝刺
// ═══════════════════════════════════════════════════════
function startSprint(){
  spQs=shuffle(MATH_UNITS[CU].qs);
  spIdx=0;spScore=0;spCombo=0;
  spBest=lsGet('ms_best_'+CU)||0;
  document.getElementById('spBest').textContent=spBest;
  document.getElementById('spScore').textContent=0;
  document.getElementById('spCombo').textContent=0;
  spRunning=true;
  document.getElementById('spTimerWrap').style.display='block';
  showSpQ();
}
function resetSprint(){
  spRunning=false;
  if(spInterval){clearInterval(spInterval);spInterval=null;}
  document.getElementById('spBanner').textContent='選好單元後按「開始衝刺」⚡';
  document.getElementById('spGrid').innerHTML='';
  document.getElementById('spComboFlash').innerHTML='';
  document.getElementById('spTimerWrap').style.display='none';
  document.getElementById('spTimerText').textContent='';
}
function showSpQ(){
  if(!spRunning)return;
  if(spIdx>=spQs.length){spQs=shuffle(MATH_UNITS[CU].qs);spIdx=0;}
  const q=spQs[spIdx];
  document.getElementById('spBanner').textContent=q.q;
  renderOpts('spGrid',shuffle(q.opts),q.a,answerSprint);
  // start timer
  if(spInterval)clearInterval(spInterval);
  spStartTime=Date.now();
  spInterval=setInterval(updateSpTimer,50);
  document.getElementById('spTimerBar').style.width='100%';
}
function updateSpTimer(){
  if(!spRunning){clearInterval(spInterval);return;}
  const elapsed=Date.now()-spStartTime;
  const pct=Math.max(0,(1-elapsed/spTime)*100);
  document.getElementById('spTimerBar').style.width=pct+'%';
  const rem=Math.ceil((spTime-elapsed)/1000);
  document.getElementById('spTimerText').textContent='剩餘 '+Math.max(0,rem)+' 秒';
  if(elapsed>=spTime){
    // time out
    clearInterval(spInterval);
    spInterval=null;
    spCombo=0;
    document.getElementById('spCombo').textContent=0;
    // show correct answer
    const q=spQs[spIdx%spQs.length];
    document.querySelectorAll('#spGrid .quiz-opt').forEach(b=>{
      if(b.textContent===q.a)b.classList.add('correct');
      b.classList.add('disabled');
    });
    document.getElementById('spBanner').textContent='⏰ 時間到！正確答案：'+q.a;
    spIdx++;
    setTimeout(showSpQ,1500);
  }
}
function answerSprint(btn,chosen,correct){
  if(!spRunning)return;
  if(spInterval){clearInterval(spInterval);spInterval=null;}
  document.getElementById('spTimerBar').style.width='0%';
  const elapsed=Date.now()-spStartTime;
  const ok=chosen===correct;
  if(ok){
    // Score by speed: faster = more points
    let pts=elapsed<1500?20:elapsed<2500?15:elapsed<3500?10:5;
    spCombo++;
    pts+=Math.min(spCombo-1,4)*3;
    spScore+=pts;
    btn.classList.add('correct');
    document.getElementById('spBanner').textContent='✅ 答對了！+'+pts+' 分';
    if(spCombo>=3) showComboFlash('spComboFlash','🔥 '+spCombo+' 連！');
  }else{
    spCombo=0;
    btn.classList.add('wrong');
    document.querySelectorAll('#spGrid .quiz-opt').forEach(b=>{
      if(b.textContent===correct)b.classList.add('correct');
    });
    document.getElementById('spBanner').textContent='❌ 正確答案是：'+correct;
  }
  document.querySelectorAll('#spGrid .quiz-opt').forEach(b=>b.classList.add('disabled'));
  document.getElementById('spScore').textContent=spScore;
  document.getElementById('spCombo').textContent=spCombo;
  if(spScore>spBest){spBest=spScore;lsSet('ms_best_'+CU,spBest);document.getElementById('spBest').textContent=spBest;}
  spIdx++;
  setTimeout(showSpQ,ok?800:1500);
}

// ═══════════════════════════════════════════════════════
// 🃏 配對翻牌
// ═══════════════════════════════════════════════════════
function startMemory(){
  const n=parseInt(document.getElementById('memPairs').value);
  const pool=shuffle(MATH_UNITS[CU].pairs).slice(0,n);
  memCards=[];
  pool.forEach((p,i)=>{
    memCards.push({pairId:i,side:'L',text:p.left,matched:false});
    memCards.push({pairId:i,side:'R',text:p.right,matched:false});
  });
  memCards=shuffle(memCards);
  memFlipped=[];memMatchCount=0;memTryCount=0;memCanFlip=true;
  renderMemGrid();
  document.getElementById('memTries').textContent=0;
  document.getElementById('memMatched').textContent=0;
  const best=lsGet('mm_best_'+CU)||{};
  document.getElementById('memBest').textContent=best[n]?(best[n]+' 次'):'—';
  document.getElementById('memWin').innerHTML='';
}
function renderMemGrid(){
  const grid=document.getElementById('memGrid');
  const cols=memCards.length<=8?4:4;
  grid.style.gridTemplateColumns='repeat('+cols+',1fr)';
  grid.innerHTML=memCards.map((c,i)=>`
    <div class="mem-card" id="mc${i}" onclick="flipCard(${i})">
      <div class="front">🔢</div>
      <div class="back">${c.text}</div>
    </div>
  `).join('');
}
function flipCard(idx){
  if(!memCanFlip)return;
  const c=memCards[idx];
  if(c.matched||memFlipped.includes(idx))return;
  document.getElementById('mc'+idx).classList.add('flipped');
  memFlipped.push(idx);
  if(memFlipped.length===2){
    memTryCount++;
    document.getElementById('memTries').textContent=memTryCount;
    memCanFlip=false;
    const [a,b]=memFlipped;
    if(memCards[a].pairId===memCards[b].pairId&&memCards[a].side!==memCards[b].side){
      // 配對成功！
      memCards[a].matched=memCards[b].matched=true;
      document.getElementById('mc'+a).classList.add('matched');
      document.getElementById('mc'+b).classList.add('matched');
      memMatchCount++;
      document.getElementById('memMatched').textContent=memMatchCount;
      memFlipped=[];memCanFlip=true;
      if(memMatchCount===memCards.length/2){
        const n=parseInt(document.getElementById('memPairs').value);
        const best=lsGet('mm_best_'+CU)||{};
        const isRecord=!best[n]||memTryCount<best[n];
        if(isRecord){best[n]=memTryCount;lsSet('mm_best_'+CU,best);document.getElementById('memBest').textContent=memTryCount+' 次';}
        document.getElementById('memWin').innerHTML=`
          <div class="win-banner">
            🎉 全部配對完成！共翻了 ${memTryCount} 次！
            ${isRecord?'🏆 新紀錄！':''}
            ${memTryCount<=memCards.length?'⭐ 超厲害！':'繼續加油！'}
          </div>`;
      }
    }else{
      setTimeout(()=>{
        document.getElementById('mc'+a).classList.remove('flipped');
        document.getElementById('mc'+b).classList.remove('flipped');
        memFlipped=[];memCanFlip=true;
      },900);
    }
  }
}

// ═══════════════════════════════════════════════════════
// 共用：Combo 閃現
// ═══════════════════════════════════════════════════════
function showComboFlash(elId,msg){
  const el=document.getElementById(elId);
  el.innerHTML='<div class="combo-flash">'+msg+'</div>';
  setTimeout(()=>{if(el)el.innerHTML='';},1000);
}
