      { sentence:'大隊接力賽的名次就要公布，在【＿＿】的人群中，我靜靜看著臺上。', answer:'吵鬧', options:['吵鬧','平靜'] },
      { sentence:'信號燈在【＿＿】的隧道發出耀眼的光芒。', answer:'黑暗', options:['明亮','黑暗'] },
      { sentence:'拿刀切菜、負責煮飯的人，我們稱他為【＿＿】。', answer:'師傅' },
      { sentence:'展示恐龍化石和古文物的地方叫做【＿＿】。', answer:'博物館' },
      { sentence:'他生病沒有休息，身體變得很【＿＿】。', answer:'薄弱' },
      { sentence:'天氣忽然從晴天【＿＿】成下雨天。', answer:'轉變' },
      { sentence:'感冒很容易【＿＿】給其他人，要記得戴口罩。', answer:'傳染' },
      { sentence:'蓋房子常用紅色的【＿＿】堆疊起來。', answer:'磚牆' },
    ]
  },

const COMBOS = {
  'all_1_6': { label: '🌟 綜合複習（第一課～第六課）', keys: ['l1','l2','l3','l4','l5','l6'] },
  'all_7_12': { label: '🌟 綜合複習（第七課～第十二課）', keys: ['l7','l8','l9','l10','l11','l12'] },
  'all_1_12': { label: '🌟🌟 綜合複習（第一課～第十二課）', keys: ['l1','l2','l3','l4','l5','l6','l7','l8','l9','l10','l11','l12'] },
};

function buildLessonSelect(){
  const sel = document.getElementById('lessonSelect');
  let html = '';
  Object.keys(LESSONS).forEach(k=>{
    html += `<option value="${k}">${LESSONS[k].title}</option>`;
  });
  Object.keys(COMBOS).forEach(k=>{
    html += `<option value="${k}">${COMBOS[k].label}</option>`;
  });
  sel.innerHTML = html;
}
buildLessonSelect();

function getActiveRounds(){
  const key = document.getElementById('lessonSelect').value;
  if(COMBOS[key]){
    let all = [];
    COMBOS[key].keys.forEach(k=>{
      LESSONS[k].rounds.forEach(r=> all.push({...r, _bank: LESSONS[k].bank}));
    });
    return all;
  }
  const lesson = LESSONS[key];
  return lesson.rounds.map(r=>({...r, _bank: lesson.bank}));
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildOptions(round){
  const bank = round._bank || [];
  let opts = round.options ? round.options.slice() : [round.answer];
  const pool = bank.filter(w=> !opts.includes(w));
  while(opts.length < 4 && pool.length){
    const idx = Math.floor(Math.random()*pool.length);
    opts.push(pool.splice(idx,1)[0]);
  }
  return shuffle(opts);
}

// ─────────────────────────────────────────────────────────
// 貪食蛇遊戲引擎
// ─────────────────────────────────────────────────────────
const COLS = 14, ROWS = 10, CELL = 56;
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');

let snake, dir, nextDir, tiles, roundQueue, roundIdx, score, timer, running;

function resetState(){
  snake = [{x:6,y:5},{x:5,y:5},{x:4,y:5}];
  dir = {x:1,y:0};
  nextDir = {x:1,y:0};
  tiles = [];
  score = 0;
  roundIdx = 0;
  roundQueue = shuffle(getActiveRounds());
  updateStats();
}

function updateStats(){
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('roundVal').textContent = Math.min(roundIdx+1, roundQueue.length);
}

function currentRound(){
  return roundQueue[roundIdx % roundQueue.length];
}

function cellFree(x,y){
  return !snake.some(s=>s.x===x&&s.y===y) && !tiles.some(t=>t.x===x&&t.y===y);
}

function randomFreeCell(){
  let x,y,tries=0;
  do { x = Math.floor(Math.random()*COLS); y = Math.floor(Math.random()*ROWS); tries++; }
  while(!cellFree(x,y) && tries < 200);
  return {x,y};
}

function spawnTiles(){
  const round = currentRound();
  const opts = buildOptions(round);
  tiles = opts.map(word=>{
    const pos = randomFreeCell();
    return { x: pos.x, y: pos.y, word, correct: word === round.answer };
  });
  document.getElementById('questionBanner').innerHTML =
    escapeHtml(round.sentence).replace('【＿＿】', '<span class="blank">？</span>');
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function setDir(x,y){
  if(!running) return;
  if(dir.x === -x && dir.y === -y) return; // 不能直接反向撞自己
  nextDir = {x,y};
}
document.addEventListener('keydown', e=>{
  const map = { ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
                w:[0,-1], s:[0,1], a:[-1,0], d:[1,0] };
  if(map[e.key]){ e.preventDefault(); setDir(map[e.key][0], map[e.key][1]); }
});

function tick(){
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if(head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS || snake.some(s=>s.x===head.x&&s.y===head.y)){
    return gameOver();
  }

  snake.unshift(head);

  const hitIdx = tiles.findIndex(t=>t.x===head.x && t.y===head.y);
  if(hitIdx >= 0){
    const tile = tiles[hitIdx];
    if(tile.correct){
      score += 10;
      roundIdx++;
      spawnTiles();
    } else {
      score = Math.max(0, score - 5);
      tiles.splice(hitIdx,1);
      const pos = randomFreeCell();
      tiles.push({ x: pos.x, y: pos.y, word: tile.word, correct: false });
      const preLen = snake.length - 1; // 蛇在這次 unshift 之前的長度
      if(preLen > 3){ snake.pop(); snake.pop(); } // 淨縮短一節
      else { snake.pop(); } // 維持最短 3 節，不再縮短
    }
    updateStats();
  } else {
    snake.pop();
  }

  draw();
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // grid dots
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  for(let x=0;x<COLS;x++) for(let y=0;y<ROWS;y++) ctx.fillRect(x*CELL+CELL/2-1, y*CELL+CELL/2-1, 2,2);

  // tiles
  tiles.forEach(t=>{
    const px = t.x*CELL, py = t.y*CELL;
    ctx.fillStyle = '#fffef7';
    roundRect(px+4, py+4, CELL-8, CELL-8, 12);
    ctx.fill();
    ctx.strokeStyle = '#A855F7';
    ctx.lineWidth = 2.5;
    roundRect(px+4, py+4, CELL-8, CELL-8, 12);
    ctx.stroke();
    ctx.fillStyle = '#1E2A4A';
    ctx.font = t.word.length >= 3 ? 'bold 15px Nunito, sans-serif' : 'bold 18px Nunito, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(t.word, px+CELL/2, py+CELL/2+1);
  });

  // snake
  snake.forEach((s,i)=>{
    const px = s.x*CELL, py = s.y*CELL;
    ctx.fillStyle = i===0 ? '#4DD9AC' : '#6BCB77';
    roundRect(px+3, py+3, CELL-6, CELL-6, 10);
    ctx.fill();
  });
  if(snake[0]){
    ctx.fillStyle = '#1E2A4A';
    const hx = snake[0].x*CELL + CELL/2, hy = snake[0].y*CELL + CELL/2;
    const ex = dir.x*8, ey = dir.y*8;
    ctx.beginPath(); ctx.arc(hx+ex-6, hy+ey-4, 3, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(hx+ex+6, hy+ey-4, 3, 0, 7); ctx.fill();
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function gameOver(){
  running = false;
  clearInterval(timer);
  document.getElementById('finalScoreText').textContent = `最終分數：${score}（答對 ${roundIdx} 題）`;
  document.getElementById('gameOverOverlay').classList.remove('hidden');
}

function getSpeedMs(){
  const secs = parseFloat(document.getElementById('speedSeconds').value);
  const v = (isNaN(secs) || secs <= 0) ? 1.5 : secs;
  return Math.round(v * 1000);
}

// 遊戲進行中調整秒數也能立刻套用，不用重新開始
document.getElementById('speedSeconds').addEventListener('change', ()=>{
  if(running){
    clearInterval(timer);
    timer = setInterval(tick, getSpeedMs());
  }
});

function startGame(){
  document.getElementById('startOverlay').classList.add('hidden');
  document.getElementById('gameOverOverlay').classList.add('hidden');
  resetState();
  spawnTiles();
  draw();
  running = true;
  clearInterval(timer);
  timer = setInterval(tick, getSpeedMs());
}
</script>
